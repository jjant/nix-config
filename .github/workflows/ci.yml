name: CI
on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: DeterminateSystems/nix-installer-action@v22
      - run: nix run nixpkgs#statix -- check .
      - run: nix run nixpkgs#deadnix -- -f .

  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: mac-m1
            cmd: nix eval .#darwinConfigurations.mac-m1.system
          - name: al2-x86_64
            cmd: nix build .#homeConfigurations.al2-x86_64.activationPackage
          - name: al2023-x86_64
            cmd: nix build .#homeConfigurations.al2023-x86_64.activationPackage
          - name: al2-aarch64
            cmd: nix eval .#homeConfigurations.al2-aarch64.activationPackage
    name: build (${{ matrix.name }})
    steps:
      - uses: actions/checkout@v7
      - uses: DeterminateSystems/nix-installer-action@v22
        with:
          extra-conf: |
            accept-flake-config = true
            always-allow-substitutes = true
      - uses: cachix/cachix-action@v17
        with:
          name: jjant-nix
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}
          extraPullNames: nix-community
      - run: ${{ matrix.cmd }}
