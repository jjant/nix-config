set-option -g default-terminal "alacritty"
set-option -ga terminal-overrides ",alacritty:RGB"
set-option -ga terminal-features ",alacritty:usstyle"

set -gu default-command
set -g default-shell "$SHELL"

# Start window and pane indices at 1
set-option -g base-index 1
set-option -g pane-base-index 1

# Close the gap when a window is killed, so the numbers stay contiguous.
# Without this, closing window 2 of `1 2 3 4` leaves `1 3 4` permanently, and
# prefix-<number> no longer lands on the nth window.
set-option -g renumber-windows on

bind '"' split-window -c "#{pane_current_path}"
bind % split-window -h -c "#{pane_current_path}"
bind c new-window -c "#{pane_current_path}"

# Alt+hjkl to move between panes (macOS)
bind-key -n ˙ select-pane -L
bind-key -n ∆ select-pane -D
bind-key -n ˚ select-pane -U
bind-key -n ¬ select-pane -R

# Vim keys: use `v` to enter visual mode, `y` to yank.
# The `y` copy binding is platform-specific (pbcopy on macOS, OSC52 on the
# Linux cloud desktops so yanks reach the local Mac clipboard over SSH) and
# is defined in ./default.nix.
bind-key -T copy-mode-vi v send-keys -X begin-selection
